<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lector de noticias con Fetch y JSON. Reto 5, Programación web del lado del cliente (UVEG).">
  <title>Pulso · Lector de noticias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Encabezado ===== -->
  <header class="encabezado">
    <div class="encabezado__marca">
      <span class="encabezado__logo" aria-hidden="true">◉</span>
      <div>
        <h1 class="encabezado__titulo">Pulso</h1>
        <p class="encabezado__subtitulo">Lector de noticias con Fetch y JSON</p>
      </div>
    </div>

    <div class="encabezado__acciones">
      <p class="estado-actualizacion" id="estado-actualizacion" aria-live="polite">Sin cargar</p>
      <button type="button" class="boton boton--primario" id="btn-refrescar">
        <span class="boton__icono" aria-hidden="true">↻</span> Refrescar
      </button>
    </div>
  </header>

  <!-- ===== Cuerpo principal ===== -->
  <main class="principal">

    <!-- Controles: fuente, búsqueda, cantidad y actualización automática -->
    <form class="controles" id="form-controles" autocomplete="off">
      <div class="campo">
        <label for="sel-fuente">Fuente</label>
        <select id="sel-fuente">
          <option value="spaceflight">Spaceflight News API (sin clave)</option>
          <option value="gnews">GNews · México en español (requiere clave)</option>
        </select>
      </div>

      <div class="campo campo--crece">
        <label for="txt-busqueda">Buscar tema</label>
        <input type="search" id="txt-busqueda" placeholder="Ej. NASA, SpaceX, Luna…">
      </div>

      <div class="campo">
        <label for="sel-cantidad">Noticias</label>
        <select id="sel-cantidad">
          <option value="6">6</option>
          <option value="9" selected>9</option>
          <option value="12">12</option>
        </select>
      </div>

      <div class="campo campo--clave" id="campo-clave" hidden>
        <label for="txt-clave">Clave de GNews</label>
        <input type="password" id="txt-clave" placeholder="Pega tu API key">
      </div>

      <div class="campo campo--boton">
        <button type="submit" class="boton boton--secundario">Buscar</button>
      </div>

      <label class="interruptor">
        <input type="checkbox" id="chk-auto">
        <span>Actualizar cada 5 min</span>
      </label>
    </form>

    <!-- Área donde se muestran las noticias -->
    <section class="area-noticias" aria-labelledby="titulo-area">
      <h2 id="titulo-area" class="area-noticias__titulo">Últimas noticias</h2>

      <!-- Mensajes de error o de lista vacía -->
      <div class="mensaje" id="mensaje" role="alert" hidden>
        <p class="mensaje__icono" id="mensaje-icono" aria-hidden="true">⚠</p>
        <p class="mensaje__titulo" id="mensaje-titulo"></p>
        <p class="mensaje__texto" id="mensaje-texto"></p>
        <button type="button" class="boton boton--secundario" id="btn-reintentar">Reintentar</button>
      </div>

      <div class="rejilla" id="lista-noticias" aria-live="polite" aria-busy="false"></div>
    </section>
  </main>

  <!-- ===== Ventana para leer la noticia completa ===== -->
  <dialog class="modal" id="modal-noticia" aria-labelledby="modal-titulo">
    <article class="modal__contenido">
      <button type="button" class="modal__cerrar" id="btn-cerrar-modal" aria-label="Cerrar">✕</button>
      <img class="modal__imagen" id="modal-imagen" alt="">
      <div class="modal__cuerpo">
        <p class="modal__meta" id="modal-meta"></p>
        <h2 class="modal__titulo" id="modal-titulo"></h2>
        <p class="modal__resumen" id="modal-resumen"></p>
        <a class="boton boton--primario" id="modal-enlace" target="_blank" rel="noopener noreferrer">
          Leer en el sitio original ↗
        </a>
      </div>
    </article>
  </dialog>

  <!-- ===== Pie ===== -->
  <footer class="pie">
    <p>Reto 5 · Programación web del lado del cliente · UVEG</p>
    <p>Datos: <a href="https://spaceflightnewsapi.net/" target="_blank" rel="noopener">Spaceflight News API</a> y <a href="https://gnews.io/" target="_blank" rel="noopener">GNews</a></p>
  </footer>

  <!-- Plantilla de tarjeta: se clona desde JavaScript -->
  <template id="plantilla-tarjeta">
    <article class="tarjeta">
      <div class="tarjeta__media">
        <img class="tarjeta__imagen" alt="" loading="lazy">
      </div>
      <div class="tarjeta__cuerpo">
        <p class="tarjeta__meta"></p>
        <h3 class="tarjeta__titulo"><button type="button" class="tarjeta__enlace"></button></h3>
        <p class="tarjeta__resumen"></p>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
