<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lector de noticias con Fetch y JSON. Reto 5, Programación web del lado del cliente (UVEG).">
  <title>Pulso · Lector de noticias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Encabezado (cabecera de periódico) ===== -->
  <header class="cabecera">
    <div class="cabecera__franja">
      <p class="cabecera__fecha" id="fecha-hoy"></p>
      <div class="cabecera__acciones">
        <p class="cabecera__estado" id="estado-actualizacion" aria-live="polite">Sin cargar</p>
        <button type="button" class="boton boton--oscuro" id="btn-refrescar">
          <span class="boton__icono" aria-hidden="true">↻</span> Refrescar
        </button>
      </div>
    </div>

    <div class="cabecera__marca">
      <h1 class="cabecera__titulo">Pulso</h1>
      <p class="cabecera__lema">Lector de noticias · Fetch y JSON</p>
    </div>

    <!-- Secciones: se generan desde JavaScript según la fuente elegida -->
    <nav class="secciones" aria-label="Secciones">
      <ul class="secciones__lista" id="nav-secciones"></ul>
    </nav>
  </header>

  <!-- ===== Cuerpo principal ===== -->
  <main class="principal">

    <!-- Controles: fuente, búsqueda, cantidad y actualización automática -->
    <form class="controles" id="form-controles" autocomplete="off">
      <div class="campo">
        <label for="sel-fuente">Fuente</label>
        <select id="sel-fuente">
          <option value="hackernews">Hacker News · tecnología (sin clave)</option>
          <option value="spaceflight">Spaceflight News · espacio (sin clave)</option>
          <option value="gnews">GNews · México en español (requiere clave)</option>
        </select>
      </div>

      <div class="campo campo--crece">
        <label for="txt-busqueda">Buscar tema</label>
        <input type="search" id="txt-busqueda" placeholder="Ej. Nvidia, Jensen Huang, inteligencia artificial…">
      </div>

      <div class="campo">
        <label for="sel-cantidad">Noticias</label>
        <select id="sel-cantidad">
          <option value="7">7</option>
          <option value="10" selected>10</option>
          <option value="13">13</option>
        </select>
      </div>

      <div class="campo campo--clave" id="campo-clave" hidden>
        <label for="txt-clave">Clave de GNews</label>
        <input type="password" id="txt-clave" placeholder="Pega tu API key">
      </div>

      <button type="submit" class="boton boton--oscuro">Buscar</button>

      <label class="interruptor">
        <input type="checkbox" id="chk-auto">
        <span>Actualizar cada 5 min</span>
      </label>
    </form>

    <!-- Área donde se muestran las noticias -->
    <section class="area-noticias" aria-labelledby="titulo-area">
      <h2 id="titulo-area" class="area-noticias__titulo">Portada</h2>

      <!-- Mensajes de error o de lista vacía -->
      <div class="mensaje" id="mensaje" role="alert" hidden>
        <p class="mensaje__titulo" id="mensaje-titulo"></p>
        <p class="mensaje__texto" id="mensaje-texto"></p>
        <button type="button" class="boton boton--oscuro" id="btn-reintentar">Reintentar</button>
      </div>

      <div class="rejilla" id="lista-noticias" aria-live="polite" aria-busy="false"></div>
    </section>
  </main>

  <!-- ===== Ventana para leer la noticia completa ===== -->
  <dialog class="modal" id="modal-noticia" aria-labelledby="modal-titulo">
    <article class="modal__contenido">
      <button type="button" class="modal__cerrar" id="btn-cerrar-modal" aria-label="Cerrar">✕</button>
      <p class="modal__seccion" id="modal-seccion"></p>
      <h2 class="modal__titulo" id="modal-titulo"></h2>
      <p class="modal__meta" id="modal-meta"></p>
      <img class="modal__imagen" id="modal-imagen" alt="">
      <p class="modal__resumen" id="modal-resumen"></p>
      <a class="boton boton--oscuro" id="modal-enlace" target="_blank" rel="noopener noreferrer">
        Leer la nota completa en el sitio original ↗
      </a>
    </article>
  </dialog>

  <!-- ===== Pie ===== -->
  <footer class="pie">
    <p class="pie__marca">Pulso</p>
    <p>Reto 5 · Programación web del lado del cliente · UVEG</p>
    <p>Datos: <a href="https://hn.algolia.com/api" target="_blank" rel="noopener">HN Search API</a>,
      <a href="https://spaceflightnewsapi.net/" target="_blank" rel="noopener">Spaceflight News API</a> y
      <a href="https://gnews.io/" target="_blank" rel="noopener">GNews</a></p>
  </footer>

  <!-- Plantilla de nota: se clona desde JavaScript -->
  <template id="plantilla-tarjeta">
    <article class="nota">
      <figure class="nota__media">
        <img class="nota__imagen" alt="" loading="lazy">
      </figure>
      <div class="nota__cuerpo">
        <p class="nota__seccion"></p>
        <h3 class="nota__titulo"><button type="button" class="nota__enlace"></button></h3>
        <p class="nota__resumen"></p>
        <p class="nota__meta"></p>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
